[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "singapore-sensor-fusion-core"
version = "0.1.0"
description = "Simulation-only RF propagation and conservative sensor-fusion primitives"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
event = ["pillow>=10", "ultralytics>=8.4"]
rgbd = ["pillow>=10", "ultralytics>=8.4", "opencv-python>=4.8"]

[project.scripts]
singapore-model-doctor = "singapore_sensor_fusion.model_doctor:main"
singapore-fusion-experiment = "singapore_sensor_fusion.experiment:main"
singapore-oak-rgbd = "singapore_sensor_fusion.oak_rgbd:main"
singapore-oak-rgbd-viewer = "singapore_sensor_fusion.oak_rgbd_viewer:main"
singapore-sensor-validation = "singapore_sensor_fusion.validation:main"
singapore-weather-fusion-sweep = "singapore_sensor_fusion.weather_sweep:main"
singapore-c3-bridge = "singapore_sensor_fusion.c3_bridge:main"
singapore-layered-runtime = "singapore_sensor_fusion.layered_runtime:main"
singapore-layered-audit = "singapore_sensor_fusion.layered_audit:main"
singapore-radar-ptz-audit = "singapore_sensor_fusion.radar_ptz_audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
