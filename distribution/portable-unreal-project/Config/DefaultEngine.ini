; Portable TRIAD project settings. Machine-generated Android file-server and
; Cesium credential settings are intentionally absent. Configure Cesium ion in
; the editor separately on every device.

; AirSimTriadRuntime is a renamed copy of the AirSim plugin. Its Blueprint and
; content assets retain references to the original mount point and script
; module, so redirect those references when the project loads.
[CoreRedirects]
+PackageRedirects=(OldName="/AirSim/",NewName="/AirSimTriadRuntime/",MatchSubstring=true)
+ClassRedirects=(OldName="/Script/AirSim.",NewName="/Script/AirSimTriadRuntime.",MatchSubstring=true)
+StructRedirects=(OldName="/Script/AirSim.",NewName="/Script/AirSimTriadRuntime.",MatchSubstring=true)
+EnumRedirects=(OldName="/Script/AirSim.",NewName="/Script/AirSimTriadRuntime.",MatchSubstring=true)

; V5C/V5D Nanite presentation requires D3D12 SM6 on Windows.
[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

; Cesium for Unreal enables Epic's Water plugin. Keep the required runtime
; collision profile explicit for commandlets and packaged builds.
[/Script/Engine.CollisionProfile]
+Profiles=(Name="WaterBodyCollision",CollisionEnabled=QueryOnly,bCanModify=False,ObjectTypeName="",CustomResponses=((Channel="WorldDynamic",Response=ECR_Overlap),(Channel="Pawn",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Ignore),(Channel="Camera",Response=ECR_Ignore),(Channel="PhysicsBody",Response=ECR_Overlap),(Channel="Vehicle",Response=ECR_Overlap),(Channel="Destructible",Response=ECR_Overlap)),HelpMessage="Default Water Collision Profile (Created by Water Plugin)")
